# ============================================================================
# orbitd.conf — Ear-Brain Daemon Configuration
# ============================================================================
# Reload at runtime via: kill -HUP $(pidof orbitd)

# --- Audio ---
[audio]
device = hw:1,0                # ALSA device for I2S capture from BES2600
sample_rate = 16000            # 16 kHz (telephony standard)
channels = 2                   # Stereo: TX (user) + RX (caller)
period_size = 160              # 10ms at 16kHz
ring_buffer_seconds = 60       # Circular buffer duration

# --- Voice Activity Detection ---
[vad]
model_path = /opt/orbitd/models/silero-vad-v5.onnx
threshold = 0.5                # Speech probability threshold [0, 1]
hangover_ms = 800              # Prevents sentence fragmentation

# --- Automatic Speech Recognition ---
[asr]
model_path = /opt/orbitd/models/whisper-base-indic-q8_0.bin
language = hi                  # Primary language (hi = Hindi/Hinglish)
threads = 2                    # Pinned to A72 cores
segment_duration_ms = 3000     # 3-second segments

# --- Named Entity Recognition (PII) ---
[ner]
model_path = /opt/orbitd/models/distilbert-ner-int8.onnx

# --- Small Language Model ---
[slm]
model_path = /opt/orbitd/models/gemma-3-1b-q4_k_m.gguf
grammar_dir = /opt/orbitd/grammars
context_size = 2048            # Token context window
max_tokens = 256               # Max tokens per generation
threads = 4                    # Use all A72 cores
temperature = 0.1              # Near-deterministic for JSON
system_prefix = You are a concise business call analyzer. Extract structured information. Output ONLY valid JSON.

# --- Transcript ---
[transcript]
max_entries = 10000
wake_words = assistant,note this down,hey orbit

# --- BLE Communications ---
[ble]
device_name = EarBrain
mtu = 247

# --- Thermal Management ---
[thermal]
sensor_path = /sys/class/thermal/thermal_zone0/temp
cpu_freq_path = /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
npu_freq_path = /sys/class/devfreq/fdab0000.npu/max_freq
threshold_warm = 35.0
threshold_hot = 38.0
threshold_critical = 41.0
threshold_emergency = 43.0
freq_full_khz = 2200000
freq_hot_khz = 1800000
freq_critical_khz = 1400000
hysteresis_margin = 2.0

# --- Watchdog ---
[watchdog]
hardware_enabled = true
timeout_seconds = 30
max_stale_seconds = 10

# --- Storage ---
[storage]
db_path = /opt/orbitd/data/earbrain.db
db_key = CHANGE_ME_TO_DERIVED_KEY     # In production: derived from phone biometric enclave

# --- Privacy & Consent ---
[privacy]
volatile_path = /volatile
volatile_size_mb = 128

[consent]
default_enabled = true
require_per_call = false
chime_path = /opt/orbitd/assets/consent_chime.raw

# --- Security ---
[security]
sandbox_enabled = true
